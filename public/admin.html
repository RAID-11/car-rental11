<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLux - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#0a0a0a;--dark:#111;--card:#1a1a1a;--border:#2a2a2a;--blue:#3b82f6;--blue-hover:#2563eb;--gold:#d4a843;--white:#fff;--gray:#888;--red:#ef4444}
body{font-family:'Montserrat',sans-serif;background:var(--black);color:var(--white);min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a0a,#0f1729)}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3rem;width:100%;max-width:420px}
.logo{font-size:2rem;font-weight:900;text-align:center;margin-bottom:.5rem}
.logo span{color:var(--blue)}
.login-subtitle{text-align:center;color:var(--gray);font-size:.9rem;margin-bottom:2rem}
.form-group{margin-bottom:1.5rem}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:var(--gray)}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#111;border:1px solid var(--border);color:var(--white);padding:.9rem 1rem;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:.9rem;outline:none;transition:border .3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue)}
.form-group textarea{resize:vertical;min-height:80px}
.btn-full{width:100%;background:var(--blue);color:#fff;border:none;padding:1rem;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:all .3s}
.btn-full:hover{background:var(--blue-hover);transform:translateY(-1px)}
.error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:.8rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none}
.dashboard{display:none}
.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:var(--dark);border-right:1px solid var(--border);padding:2rem 0;z-index:100;overflow-y:auto}
.sidebar-logo{font-size:1.4rem;font-weight:900;padding:0 1.5rem 2rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.sidebar-logo span{color:var(--blue)}
.sidebar-logo small{display:block;font-size:.7rem;color:var(--gray);font-weight:400;margin-top:.2rem}
.nav-item{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.5rem;color:var(--gray);text-decoration:none;font-size:.85rem;font-weight:600;transition:all .3s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover,.nav-item.active{color:var(--blue);background:rgba(59,130,246,0.05);border-right:3px solid var(--blue)}
.main-content{margin-left:250px;padding:2rem;min-height:100vh}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.top-bar h1{font-size:1.4rem;font-weight:700}
.top-bar h1 span{color:var(--blue)}
.user-info{display:flex;align-items:center;gap:1rem}
.user-avatar{width:38px;height:38px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.btn-logout{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.8rem;font-family:'Montserrat',sans-serif;font-weight:600;transition:all .3s}
.btn-logout:hover{background:#ef4444;color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.5rem;margin-bottom:2rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;display:flex;align-items:center;gap:1rem;transition:all .3s}
.stat-card:hover{border-color:var(--blue)}
.stat-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.stat-icon.blue{background:rgba(59,130,246,0.1);color:var(--blue)}
.stat-icon.gold{background:rgba(212,168,67,0.1);color:var(--gold)}
.stat-icon.purple{background:rgba(139,92,246,0.1);color:#8b5cf6}
.stat-icon.red{background:rgba(239,68,68,0.1);color:#ef4444}
.stat-info h3{font-size:1.8rem;font-weight:900}
.stat-info p{color:var(--gray);font-size:.75rem}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:2rem}
.section-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.section-card-header h2{font-size:1.1rem;font-weight:700}
.btn-add{background:var(--blue);color:#fff;border:none;padding:.7rem 1.5rem;border-radius:8px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:.5rem;transition:all .3s}
.btn-add:hover{background:var(--blue-hover)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.modal-header h3{font-size:1.1rem;font-weight:700}
.btn-close{background:none;border:none;color:var(--gray);font-size:1.2rem;cursor:pointer}
.btn-close:hover{color:#ef4444}
.cars-table{width:100%;border-collapse:collapse}
.cars-table th{text-align:left;padding:.8rem 1rem;font-size:.75rem;color:var(--gray);font-weight:600;border-bottom:1px solid var(--border);text-transform:uppercase}
.cars-table td{padding:.9rem 1rem;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
.cars-table tr:hover td{background:rgba(255,255,255,0.02)}
.car-thumb{width:55px;height:42px;border-radius:6px;object-fit:cover}
.badge{font-size:.72rem;font-weight:700;padding:.25rem .7rem;border-radius:50px;text-transform:uppercase}
.badge-eco{background:rgba(59,130,246,0.15);color:var(--blue)}
.badge-suv{background:rgba(139,92,246,0.15);color:#8b5cf6}
.badge-luxe{background:rgba(212,168,67,0.15);color:var(--gold)}
.btn-edit{background:rgba(59,130,246,0.1);color:var(--blue);border:1px solid rgba(59,130,246,0.3);padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'Montserrat',sans-serif;font-weight:600;transition:all .3s;margin-right:.4rem}
.btn-edit:hover{background:var(--blue);color:#fff}
.btn-delete{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.3);padding:.35rem .7rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:'Montserrat',sans-serif;font-weight:600;transition:all .3s}
.btn-delete:hover{background:#ef4444;color:#fff}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--blue);color:#fff;padding:1rem 1.5rem;border-radius:10px;font-weight:700;font-size:.9rem;z-index:9999;transform:translateY(100px);transition:transform .3s}
.toast.show{transform:translateY(0)}
.toast.error{background:#ef4444}
.page{display:none}.page.active{display:block}
.preview-img{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-top:.5rem;display:none}
@media(max-width:768px){
  .sidebar{position:relative;width:100%;height:auto;display:flex;flex-wrap:wrap;padding:.5rem}
  .sidebar-logo{width:100%;padding:1rem}
  .nav-item{width:auto;padding:.5rem .8rem;font-size:.8rem}
  .main-content{margin-left:0;padding:1rem}
  .stats-grid{grid-template-columns:1fr 1fr}
  .top-bar{flex-direction:column;gap:1rem;align-items:flex-start}
  .cars-table th:nth-child(5),.cars-table td:nth-child(5){display:none}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .modal-card{padding:1.2rem}
}
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="logo">AUTO<span>LUX</span></div>
    <p class="login-subtitle">Panneau d'administration</p>
    <div class="error-msg" id="loginError">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="loginErrorText"></span>
    </div>
    <div class="form-group">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" placeholder="admin">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn-full" onclick="login()">
      <i class="fas fa-sign-in-alt"></i> Se connecter
    </button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="sidebar">
    <div class="sidebar-logo">AUTO<span>LUX</span><small>Admin Panel</small></div>
    <button class="nav-item active" onclick="showPage('overview',event)"><i class="fas fa-chart-pie"></i> Vue d'ensemble</button>
    <button class="nav-item" onclick="showPage('cars',event)"><i class="fas fa-car"></i> Gérer les Voitures</button>
    <button class="nav-item" onclick="showPage('settings',event)"><i class="fas fa-cog"></i> Paramètres</button>
    <a href="/" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Voir le Site</a>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h1>Bienvenue, <span>Admin</span></h1>
      <div class="user-info">
        <div class="user-avatar">A</div>
        <button class="btn-logout" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Déconnexion
        </button>
      </div>
    </div>

    <div class="page active" id="page-overview">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-car"></i></div><div class="stat-info"><h3 id="totalCars">0</h3><p>Total Voitures</p></div></div>
        <div class="stat-card"><div class="stat-icon gold"><i class="fas fa-crown"></i></div><div class="stat-info"><h3 id="luxeCars">0</h3><p>Luxe</p></div></div>
        <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-truck"></i></div><div class="stat-info"><h3 id="suvCars">0</h3><p>SUV</p></div></div>
        <div class="stat-card"><div class="stat-icon red"><i class="fas fa-tag"></i></div><div class="stat-info"><h3 id="ecoCars">0</h3><p>Économique</p></div></div>
      </div>
      <div class="section-card">
        <div class="section-card-header">
          <h2>🚗 Dernières Voitures</h2>
          <button class="btn-add" onclick="showPage('cars',event)"><i class="fas fa-plus"></i> Ajouter</button>
        </div>
        <div id="recentCars"></div>
      </div>
    </div>

    <div class="page" id="page-cars">
      <div class="section-card">
        <div class="section-card-header">
          <h2>🚗 Gestion des Voitures</h2>
          <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Ajouter</button>
        </div>
        <div style="overflow-x:auto">
          <table class="cars-table">
            <thead><tr><th>Photo</th><th>Nom</th><th>Prix</th><th>Catégorie</th><th>WhatsApp</th><th>Actions</th></tr></thead>
            <tbody id="carsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="page" id="page-settings">
      <div class="section-card" style="max-width:480px">
        <div class="section-card-header"><h2>⚙️ Changer le Mot de Passe</h2></div>
        <div class="form-group"><label>Nouveau Mot de Passe</label><input type="password" id="newPass" placeholder="Nouveau mot de passe"></div>
        <div class="form-group"><label>Confirmer</label><input type="password" id="confirmPass" placeholder="Confirmer"></div>
        <button class="btn-full" onclick="changePassword()"><i class="fas fa-key"></i> Changer</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="carModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Ajouter une Voiture</h3>
      <button class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-group"><label>Nom</label><input type="text" id="carName" placeholder="Ex: Range Rover Vogue"></div>
    <div class="form-group"><label>Prix (DH/jour)</label><input type="number" id="carPrice" placeholder="Ex: 1800"></div>
    <div class="form-group"><label>Catégorie</label>
      <select id="carCategory">
        <option value="economique">Économique</option>
        <option value="suv">SUV</option>
        <option value="luxe">Luxe</option>
      </select>
    </div>
    <div class="form-group"><label>Description</label><textarea id="carDesc" placeholder="Description..."></textarea></div>
    <div class="form-group">
      <label>Image</label>
      <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
        <button type="button" onclick="document.getElementById('fileInput').click()" style="background:var(--card);color:var(--blue);border:1px solid var(--blue);padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.8rem;font-family:Montserrat,sans-serif"><i class="fas fa-upload"></i> Depuis PC</button>
        <span style="color:var(--gray);font-size:.8rem;align-self:center">ou URL</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadFile()">
      <input type="text" id="carImage" placeholder="https://..." oninput="previewImage()">
      <img id="imgPreview" class="preview-img" alt="Preview">
    </div>
    <div class="form-group"><label>Numéro WhatsApp</label><input type="text" id="carWhatsapp" placeholder="212600000000"></div>
    <button class="btn-full" onclick="saveCar()"><i class="fas fa-save"></i> Enregistrer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://car-rental11-production.up.railway.app/api';
const BASE = 'https://car-rental11-production.up.railway.app';
let token = localStorage.getItem('autolux_token');
let cars = [];
let editingId = null;

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) {
    showError('Veuillez remplir tous les champs');
    return;
  }
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur de connexion');
    token = data.token;
    localStorage.setItem('autolux_token', token);
    showDashboard();
  } catch(e) {
    showError(e.message);
  }
}

function showError(msg) {
  const el = document.getElementById('loginError');
  document.getElementById('loginErrorText').textContent = msg;
  el.style.display = 'block';
}

function showDashboard() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadCars();
}

function logout() {
  localStorage.removeItem('autolux_token');
  location.reload();
}

async function loadCars() {
  try {
    const res = await fetch(`${API}/cars`);
    cars = await res.json();
    updateStats();
    renderTable();
    renderRecent();
  } catch(e) {
    showToast('Erreur de chargement', true);
  }
}

function updateStats() {
  document.getElementById('totalCars').textContent = cars.length;
  document.getElementById('luxeCars').textContent = cars.filter(c=>c.category==='luxe').length;
  document.getElementById('suvCars').textContent = cars.filter(c=>c.category==='suv').length;
  document.getElementById('ecoCars').textContent = cars.filter(c=>c.category==='economique').length;
}

function renderTable() {
  document.getElementById('carsTableBody').innerHTML = cars.map(car => `
    <tr>
      <td><img src="${car.image}" class="car-thumb" onerror="this.src='https://via.placeholder.com/55x42'"></td>
      <td><strong>${car.name}</strong></td>
      <td><strong>${car.price} DH</strong>/jour</td>
      <td><span class="badge badge-${car.category==='economique'?'eco':car.category}">${car.category}</span></td>
      <td>+${car.whatsapp}</td>
      <td>
        <button class="btn-edit" onclick="editCar('${car.id}')"><i class="fas fa-edit"></i></button>
        <button class="btn-delete" onclick="deleteCar('${car.id}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>
  `).join('');
}

function renderRecent() {
  document.getElementById('recentCars').innerHTML = `
    <table class="cars-table">
      <thead><tr><th>Photo</th><th>Nom</th><th>Prix</th><th>Catégorie</th></tr></thead>
      <tbody>${cars.slice(-5).reverse().map(car=>`
        <tr>
          <td><img src="${car.image}" class="car-thumb" onerror="this.src='https://via.placeholder.com/55x42'"></td>
          <td>${car.name}</td>
          <td>${car.price} DH/jour</td>
          <td><span class="badge badge-${car.category==='economique'?'eco':car.category}">${car.category}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function showPage(page, e) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  if(e && e.currentTarget) e.currentTarget.classList.add('active');
}

function openModal(id=null) {
  editingId = id;
  document.getElementById('carModal').classList.add('open');
  if (id) {
    const car = cars.find(c=>c.id===id);
    document.getElementById('modalTitle').textContent = 'Modifier la Voiture';
    document.getElementById('carName').value = car.name;
    document.getElementById('carPrice').value = car.price;
    document.getElementById('carCategory').value = car.category;
    document.getElementById('carDesc').value = car.description;
    document.getElementById('carImage').value = car.image;
    document.getElementById('carWhatsapp').value = car.whatsapp;
    previewImage();
  } else {
    document.getElementById('modalTitle').textContent = 'Ajouter une Voiture';
    document.getElementById('carName').value = '';
    document.getElementById('carPrice').value = '';
    document.getElementById('carDesc').value = '';
    document.getElementById('carImage').value = '';
    document.getElementById('carWhatsapp').value = '212600000000';
    document.getElementById('imgPreview').style.display = 'none';
  }
}

function editCar(id) { openModal(id); }
function closeModal() { document.getElementById('carModal').classList.remove('open'); editingId = null; }

function previewImage() {
  const img = document.getElementById('imgPreview');
  const url = document.getElementById('carImage').value;
  if (url) { img.src = url; img.style.display = 'block'; }
  else { img.style.display = 'none'; }
}

async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('image', file);
  showToast('⏳ Upload en cours...');
  try {
    const res = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${token}`},
      body: formData
    });
    const data = await res.json();
    document.getElementById('carImage').value = `${BASE}${data.url}`;
    previewImage();
    showToast('✅ Image uploadée!');
  } catch { showToast('Erreur upload!', true); }
}

async function saveCar() {
  const car = {
    name: document.getElementById('carName').value,
    price: document.getElementById('carPrice').value,
    category: document.getElementById('carCategory').value,
    description: document.getElementById('carDesc').value,
    image: document.getElementById('carImage').value,
    whatsapp: document.getElementById('carWhatsapp').value
  };
  if (!car.name || !car.price) { showToast('Remplissez tous les champs!', true); return; }
  try {
    const url = editingId ? `${API}/cars/${editingId}` : `${API}/cars`;
    const method = editingId ? 'PUT' : 'POST';
    await fetch(url, {
      method,
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify(car)
    });
    closeModal();
    await loadCars();
    showToast(editingId ? '✅ Voiture modifiée!' : '✅ Voiture ajoutée!');
  } catch { showToast('Erreur serveur', true); }
}

async function deleteCar(id) {
  if (!confirm('Supprimer cette voiture?')) return;
  await fetch(`${API}/cars/${id}`, {
    method: 'DELETE',
    headers: {'Authorization': `Bearer ${token}`}
  });
  await loadCars();
  showToast('🗑️ Voiture supprimée!');
}

async function changePassword() {
  const np = document.getElementById('newPass').value;
  const cp = document.getElementById('confirmPass').value;
  if (!np) { showToast('Entrez un mot de passe!', true); return; }
  if (np !== cp) { showToast('Les mots de passe ne correspondent pas!', true); return; }
  try {
    await fetch(`${API}/change-password`, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify({newPassword: np})
    });
    showToast('✅ Mot de passe changé!');
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  } catch { showToast('Erreur!', true); }
}

function showToast(msg, error=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast${error?' error':''} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('password').addEventListener('keypress', e => {
  if(e.key==='Enter') login();
});

// Check token validity
if (token) {
  fetch(`${API}/cars`, {
    headers: {'Authorization': `Bearer ${token}`}
  }).then(r => {
    if (r.ok) showDashboard();
    else {
      localStorage.removeItem('autolux_token');
      token = null;
    }
  }).catch(() => {
    localStorage.removeItem('autolux_token');
    token = null;
  });
}
</script>
